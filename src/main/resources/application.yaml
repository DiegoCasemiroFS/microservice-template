app:
  security:
    enabled: true
    authorities-claim: scope
    authority-prefix: ROLE_
    public-paths: []

spring:
  application:
    name: microservice-template

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}
          audiences: ${SERVICE_AUDIENCE:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: never